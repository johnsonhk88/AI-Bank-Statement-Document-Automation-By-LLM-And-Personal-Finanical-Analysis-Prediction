providers:
  - id: lm-studio
    display_name: LM Studio (Local)
    kind: local
    base_url: http://host.docker.internal:1234/v1
    api_key_env: LM_STUDIO_API_KEY
    litellm_prefix: openai
    models:
      - id: openai/qwen2.5-14b-instruct
        display_name: Qwen 2.5 14B Instruct
      - id: openai/google/gemma-3-12b-qat
        display_name: Gemma 3 12B QAT

  - id: ollama
    display_name: Ollama (Local)
    kind: local
    base_url: http://host.docker.internal:11434
    litellm_prefix: ollama
    models:
      - id: ollama/llama3.2
        display_name: Llama 3.2

  - id: vllm
    display_name: vLLM (Local)
    kind: local
    base_url: http://host.docker.internal:8001/v1
    api_key_env: VLLM_API_KEY
    litellm_prefix: openai
    models:
      - id: openai/qwen-small
        display_name: Start vLLM — live models replace this

  - id: sglang
    display_name: SGLang (Local)
    kind: local
    base_url: http://host.docker.internal:30000/v1
    api_key_env: SGLANG_API_KEY
    litellm_prefix: openai
    models:
      - id: openai/qwen-small
        display_name: Start SGLang — live models replace this

  - id: strata
    display_name: Strata (Local)
    kind: local
    base_url: http://host.docker.internal:8080/v1
    api_key_env: STRATA_API_KEY
    litellm_prefix: openai
    models:
      - id: openai/qwen3.8-flash-next-iq2_xs
        display_name: Start Strata — live models replace this

  - id: openrouter
    display_name: OpenRouter (Cloud)
    kind: cloud
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    models:
      - id: openrouter/google/gemini-2.5-flash
        display_name: Gemini 2.5 Flash
      - id: openrouter/anthropic/claude-3.5-sonnet
        display_name: Claude 3.5 Sonnet

  - id: gemini
    display_name: Google Gemini (Cloud)
    kind: cloud
    api_key_env: GOOGLE_API_KEY
    models:
      - id: gemini/gemini-2.5-flash
        display_name: Gemini 2.5 Flash

  - id: openai
    display_name: OpenAI (Cloud)
    kind: cloud
    api_key_env: OPENAI_API_KEY
    models:
      - id: openai/gpt-4o-mini
        display_name: GPT-4o Mini
      - id: openai/gpt-4o
        display_name: GPT-4o
