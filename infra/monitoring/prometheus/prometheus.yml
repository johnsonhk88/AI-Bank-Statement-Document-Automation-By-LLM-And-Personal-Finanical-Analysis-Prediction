global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: dcgm
    static_configs:
      - targets:
          - host.docker.internal:9400
  - job_name: node
    static_configs:
      - targets:
          - host.docker.internal:9100
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8001
  - job_name: sglang
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:30000
  - job_name: strata
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8080
